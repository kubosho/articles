name: Update Blog Submodule

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-submodule:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The default GITHUB_TOKEN cannot push to another repository, so use
      # a GitHub App token scoped to kubosho/blog.kubosho.com.
      # APP_ID / APP_PRIVATE_KEY must belong to a GitHub App with
      # Contents: Read and write permission on kubosho/blog.kubosho.com.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kubosho
          repositories: blog.kubosho.com

      - name: Checkout blog repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: kubosho/blog.kubosho.com
          ref: main
          submodules: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update articles submodule reference
        id: update
        env:
          ARTICLES_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git -C articles fetch origin "${ARTICLES_SHA}"
          git -C articles checkout "${ARTICLES_SHA}"

          if git diff --quiet -- articles; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          git commit -m "chore: update articles submodule to kubosho/articles@${ARTICLES_SHA::7}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push updates to blog repository
        if: steps.update.outputs.has_changes == 'true'
        run: git push origin HEAD:main
