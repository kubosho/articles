name: Update Blog Submodule

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'

permissions:
  contents: read

jobs:
  update-submodule:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The default GITHUB_TOKEN cannot push to another repository, so use
      # a GitHub App token scoped to kubosho/blog.kubosho.com.
      # APP_ID / APP_PRIVATE_KEY must belong to a GitHub App with
      # Contents: Read and write permission on kubosho/blog.kubosho.com.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kubosho
          repositories: blog.kubosho.com

      - name: Checkout blog repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubosho/blog.kubosho.com
          ref: main
          submodules: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Another push to articles/main (or a concurrent run of this workflow)
      # can advance blog.kubosho.com's main between the checkout above and
      # the push below, which rejects the push as non-fast-forward. Refetch
      # main right before each push attempt and retry to close that race.
      - name: Update articles submodule reference and push
        env:
          ARTICLES_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            git submodule update --init articles

            git -C articles fetch origin "${ARTICLES_SHA}"
            git -C articles checkout "${ARTICLES_SHA}"

            if git diff --quiet -- articles; then
              echo "No submodule changes to push"
              exit 0
            fi

            git add articles
            git commit -m "chore: update articles submodule to kubosho/articles@${ARTICLES_SHA::7}"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}, retrying after refetching main"
            sleep $((attempt * 3))
          done

          echo "Failed to push after retries" >&2
          exit 1
